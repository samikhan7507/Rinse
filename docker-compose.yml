# Production stack: Rinse behind Caddy, which adds automatic HTTPS and security headers.
# 1) Copy .env.example to .env and fill it in.  2) Set RINSE_DOMAIN in .env.  3) docker compose up -d
services:
  rinse:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - rinse-data:/app/storage
    expose: ["3838"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3838/?health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [rinse]
    ports: ["80:80", "443:443"]
    environment:
      RINSE_DOMAIN: ${RINSE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  rinse-data:
  caddy-data:
  caddy-config:
